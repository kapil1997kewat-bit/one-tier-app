apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: one-tier-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-github-username>/one-tier-app.git
    targetRevision: main
    path: helm/one-tier-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
