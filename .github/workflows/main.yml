name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  DOCKERHUB_REPO: kapilkewatdevops/one-tier-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKERHUB_REPO }}:${{ github.run_number }} .
          docker tag ${{ env.DOCKERHUB_REPO }}:${{ github.run_number }} ${{ env.DOCKERHUB_REPO }}:latest

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKERHUB_REPO }}:${{ github.run_number }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest
